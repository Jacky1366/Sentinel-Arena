# Sentinel Arena, Stage 1: Target (OWASP Juice Shop) behind a logging-only nginx proxy.
#
# Juice Shop has NO published ports and sits only on the `internal` network
# (internal: true = no route to the host or the internet). nginx is the single
# entry point, published on 127.0.0.1 only. nginx has NO defenses; it only logs
# and forwards (CLAUDE.md, design principle 1).
#
#   docker compose up -d --wait     # returns once Juice Shop is healthy
#   tools/smoke_test.sh

name: sentinel-arena

services:
  juice-shop:
    # v20.3.0: newest release (2026-10-11), multi-arch (amd64 + arm64).
    # Pinned so challenge names/behaviour do not drift under the Judge.
    image: bkimminich/juice-shop:v20.3.0
    networks:
      - internal
    # No `ports:` on purpose. Reachable only through nginx.
    healthcheck:
      # The image has no curl/wget; use its own node binary.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  nginx:
    # 1.30.x is nginx's stable branch (bug/security fixes only); alpine for size.
    image: nginx:1.30.6-alpine
    depends_on:
      juice-shop:
        condition: service_healthy
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:8080:80"   # loopback only, never 0.0.0.0
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/runs/live:/var/log/arena
    networks:
      - internal
      - edge
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}
