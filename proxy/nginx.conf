# Sentinel Arena proxy: LOG AND FORWARD ONLY.
#
# No WAF, no rate limiting, no auth, no caching, no compression (CLAUDE.md design
# principle 1). All defense lives in Blue so the Judge can measure it.
#
# Each request produces one JSON line in /var/log/arena/proxy.jsonl
# (host: data/runs/live/proxy.jsonl) matching schemas/proxy_log.schema.json.
# This file replaces the image's /etc/nginx/nginx.conf entirely and does NOT
# include conf.d/, so no other access log exists.

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # timestamp: $time_iso8601 is "2026-11-02T22:15:03+00:00" with TZ=UTC.
    # Rewrite the "+00:00" suffix to "Z". Any other offset passes through
    # unchanged and fails the schema, so a wrong TZ is caught, not hidden.
    map $time_iso8601 $arena_timestamp {
        "~^(?<arena_ts_base>.+)\+00:00$"  "${arena_ts_base}Z";
        default                           $time_iso8601;
    }

    # path: the RAW path from the request line, query string stripped.
    # Never $uri: it is percent-decoded and dot-segment-normalized, which
    # destroys path-traversal evidence.
    map $request_uri $arena_path {
        "~^(?<arena_raw_path>[^?]*)"  $arena_raw_path;
        default                       $request_uri;
    }

    # Field order and names match the proxy_log schema exactly.
    # Missing X-Arena-Request-Id -> "request_id":"" -> stray traffic.
    log_format arena escape=json
        '{"timestamp":"$arena_timestamp",'
        '"request_id":"$http_x_arena_request_id",'
        '"method":"$request_method",'
        '"path":"$arena_path",'
        '"query":"$args",'
        '"body":"$request_body",'
        '"status":$status}';

    # Unbuffered so each line is on disk when the request completes.
    access_log /var/log/arena/proxy.jsonl arena;

    # $request_body is only populated when the body is held in memory; keep the
    # buffer as large as the max body so it is never spooled to a temp file.
    client_body_buffer_size 1m;
    client_max_body_size    1m;

    # Raise the 8k default so long attack URLs/headers are forwarded, not 414'd.
    large_client_header_buffers 4 32k;

    # Arena port: the only traffic Blue ever sees. Logs every request.
    server {
        listen 80 default_server;
        server_name _;

        location / {
            # No URI part: nginx forwards the client's original request URI
            # unmodified (no decoding, no normalization).
            proxy_pass http://juice-shop:3000;
            proxy_set_header Host               $http_host;
            proxy_set_header X-Arena-Request-Id $http_x_arena_request_id;
        }
    }

    # Admin port: the Judge's measurement path ONLY. Published on 127.0.0.1:8081.
    # access_log is OFF here, so reading challenge state never adds a line to
    # proxy.jsonl — measurement must not disturb what it measures (Blue's input).
    # Only the read-only challenges API is reachable; everything else is 403.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location /api/Challenges {
            proxy_pass http://juice-shop:3000;
            proxy_set_header Host $http_host;
        }

        location / {
            return 403;
        }
    }
}
